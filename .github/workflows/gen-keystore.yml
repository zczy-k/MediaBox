name: Generate Release Keystore (one-off)

# 一次性工具：本机无 JDK/keytool，借 CI(runner 自带 JDK 21) 生成 JKS。
# 生成后由人工把 artifact 里的 jks + base64 写回 GitHub Secrets，然后删除本文件。

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'mediabox'
      store_password:
        description: 'Store password'
        required: true
      key_password:
        description: 'Key password'
        required: true

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS
        env:
          ALIAS: ${{ inputs.alias }}
          STORE_PASSWORD: ${{ inputs.store_password }}
          KEY_PASSWORD: ${{ inputs.key_password }}
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -keystore app-release.jks -storetype JKS \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=MediaBox, OU=Release, O=MediaBox, L=, ST=, C=CN"

          echo "== magic check (expect feedfeed) =="
          head -c 4 app-release.jks | od -An -tx1 | tr -d ' \n'; echo

          base64 -w0 app-release.jks > app-release.jks.b64
          wc -c app-release.jks app-release.jks.b64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-jks
          path: |
            app-release.jks
            app-release.jks.b64
          retention-days: 1