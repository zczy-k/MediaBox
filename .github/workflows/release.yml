name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version / tag (e.g. v1.0.1) —— 同时作为 APK 的 versionName'
        required: true
        default: 'v1.0.1'
      prerelease:
        description: '标记为 Pre-release'
        type: boolean
        required: false
        default: false
      publish_release:
        description: '是否作为正式版发布。⚠️ 不勾 = 自用调试包(跳过强制更新、标为 Pre-release);勾上 = 正式版(强制更新、进 releases/latest)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: .

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Set up Python 3.10 (Chaquopy build Python)
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install required SDK/NDK & verify
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          [ -n "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }

          sdkmanager() { "$SDKMANAGER" "$@"; }

          echo "== 仓库里可用的 API 37 平台 / NDK 27 =="
          ALL="$(sdkmanager --list 2>/dev/null)" || true
          PLATFORM="$(echo "$ALL" | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -V | tail -n1 || true)"
          NDK="$(echo "$ALL" | grep -oE 'ndk;27\.2\.12479018' | sort -V | tail -n1 || true)"
          BUILD_TOOLS="$(echo "$ALL" | grep -oE 'build-tools;3[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1 || true)"
          echo "PLATFORM=$PLATFORM  NDK=$NDK  BUILD_TOOLS=$BUILD_TOOLS"
          [ -n "$PLATFORM" ] || { echo "::error::仓库里找不到 android-37 平台"; exit 1; }
          [ -n "$NDK" ] || { echo "::error::仓库里找不到 ndk;27.2.12479018"; exit 1; }

          # --licenses 在无待接受许可时会因管道 broken pipe 返回非 0,故忽略其结果
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          ARGS=("$PLATFORM" "$NDK")
          [ -n "$BUILD_TOOLS" ] && ARGS+=("$BUILD_TOOLS")
          sdkmanager "${ARGS[@]}"

          test -d "$SDK_ROOT/platforms/${PLATFORM#platforms;}" \
            || { echo "::error::$PLATFORM 未安装"; exit 1; }
          test -d "$SDK_ROOT/ndk/${NDK#ndk;}" || { echo "::error::$NDK 未安装"; exit 1; }
          python3 -c "import sys; print('build python:', sys.version)"

      - name: chmod gradlew
        run: chmod +x gradlew

      # 签名材料不入库：keystore 与三个口令全部来自 GitHub Secrets，
      # 在此还原到 .key/app-release.jks 与环境变量，构建完随 runner 销毁。
      - name: Restore signing material from Secrets
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=0
          for v in KEYSTORE_B64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v 未配置（仓库 Settings → Secrets and variables → Actions）"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || { echo "::error::签名 Secrets 不完整，无法出签名包"; exit 1; }

          mkdir -p .key
          printf '%s' "$KEYSTORE_B64" | base64 -d > .key/app-release.jks
          test -s .key/app-release.jks || { echo "::error::keystore 解码失败/为空"; exit 1; }
          # JKS 魔数校验：0xFEEDFEED
          test "$(head -c 4 .key/app-release.jks | od -An -tx1 | tr -d ' \n')" = "feedfeed" \
            || { echo "::error::.key/app-release.jks 不是有效 JKS（魔数不符）"; exit 1; }

          {
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "RELEASE_STORE_FILE=.key/app-release.jks" >> "$GITHUB_ENV"
          ls -l .key/app-release.jks
          echo "::notice::签名材料已从 Secrets 还原"

      - name: Build release APK
        # -PappVersionName 把 tag 注入 APK 的 versionName:App 内更新检查拿 tag 与本地
        # versionName 比较,两者不同源会让"永远提示有新版本"或"永远提示已最新"。
        # 安全默认:publish_release 不为 true 时一律当自用调试包 —— 传 -PforceUpdate=false
        # 把启动强制更新整个编译掉,避免"只想自己测一下"却把强制更新推给所有用户(不可逆)。
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${{ github.event.inputs.publish_release }}" != "true" ]; then
            echo "::notice::自用调试包:已关闭启动强制更新(如需正式发布请勾选 publish_release)"
            EXTRA="-PforceUpdate=false"
          else
            echo "::notice::正式版:启动强制更新已启用"
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PappVersionName='${{ github.event.inputs.version }}' $EXTRA

      - name: Rename & verify APK
        id: apk
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/release/MediaBox_release.apk
          test -f "$SRC" || { echo "::error::未找到 $SRC"; exit 1; }

          VERSION='${{ github.event.inputs.version }}'
          OUT="MediaBox_${VERSION}_arm64-v8a.apk"
          cp "$SRC" "$OUT"

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -r | head -n1)"
          echo "apksigner: $APKSIGNER"
          if [ -n "$APKSIGNER" ]; then
            # 必须是已签名包;再确认 signer 的 DN 里有 MediaBox(防止误用别keystore)。
            # 注意比对的是证书 DN(CN=MediaBox),不是 key alias —— 两者不必同名,
            # 早先按别名小写 mediabox 匹配导致好包被判失败。
            CERTS="$("$APKSIGNER" verify --print-certs "$OUT")" || { echo "::error::APK 签名校验失败"; exit 1; }
            echo "$CERTS"
            echo "$CERTS" | grep -qi "mediabox" \
              || { echo "::error::signer DN 与预期不符(期望包含 MediaBox)"; exit 1; }
          else
            echo "::warning::未找到 apksigner，跳过签名校验"
          fi
          echo "size: $(du -h "$OUT" | cut -f1)"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      # 同版本重跑时 action-gh-release 会就地更新已有 release（只换 APK）
      - name: Check if release already exists
        id: existing_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION='${{ github.event.inputs.version }}'
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "existed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION 已有 release：本次就地覆盖 APK"
          else
            echo "existed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: ${{ steps.apk.outputs.path }}
          # 非正式发布一律强制 Pre-release:否则调试包会进 releases/latest,
          # 所有正式用户会被强制更新到你的调试包上(灾难性,且不可逆)
          prerelease: ${{ github.event.inputs.prerelease == 'true' || github.event.inputs.publish_release != 'true' }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
